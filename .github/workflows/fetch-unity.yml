name: Fetch Unity Editor 6000.3.20f1
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download Unity macOS ARM64 pkg
        run: |
          set -e
          URL="https://download.unity3d.com/download_unity/c9ba695d4f07/MacEditorInstallerArm64/Unity-6000.3.20f1.pkg"
          curl -fL --retry 3 -o unity.pkg "$URL"
          SIZE=$(stat -c%s unity.pkg)
          echo "downloaded: $SIZE bytes"
          if [ "$SIZE" != "5147077566" ]; then echo "SIZE_MISMATCH"; exit 1; fi
          echo "SIZE_OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-6000.3.20f1-arm64-pkg
          path: unity.pkg
          compression-level: 0
          retention-days: 1
